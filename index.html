<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRX Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Includes padding in width */
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 0.85em;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CRX Analyzer</h1>
    <p>Analyze browser extensions via GitHub Actions</p>

    <div class="form-group">
        <label for="ext-id">Extension ID</label>
        <input type="text" id="ext-id" placeholder="e.g. eaijffijbobmnonfhilihbejadplhddo" required>
    </div>

    <div class="form-group">
        <label for="browser">Browser Store</label>
        <select id="browser">
            <option value="chrome">Chrome Web Store</option>
            <option value="edge">Edge Add-ons</option>
        </select>
    </div>

    <button onclick="submitAnalysis()">Analyze Extension</button>

    <p class="footer-note">This will redirect you to create a GitHub Issue. The analysis result will be posted as a comment automatically.</p>
</div>

<script>
    function submitAnalysis() {
        const id = document.getElementById('ext-id').value.trim();
        const browser = document.getElementById('browser').value;

        if (!id) {
            alert('Please enter an Extension ID.');
            return;
        }

        // Automatically determine the repository from the GitHub Pages URL path
        // Example path: /CRX-Analyzert/ -> Repository: username/CRX-Analyzert
        // If not hosted on gh-pages, it will default to a fallback string which you should change manually.
        let repo = "Bejazs/CRX-Analyzert";

        // window.location.pathname usually looks like "/repo-name/" on GitHub pages
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        if (window.location.hostname.endsWith(".github.io") && pathSegments.length > 0) {
            const username = window.location.hostname.split('.')[0];
            const reponame = pathSegments[0];
            repo = `${username}/${reponame}`;
        }

        const issueTitle = encodeURIComponent(`Analyze Extension: ${id}`);
        const issueBody = encodeURIComponent(`Please analyze the following extension:\n\n**ID:** ${id}\n**Browser:** ${browser}\n\n_Do not edit this issue. The GitHub Action will process this request and comment with the results._`);

        const url = `https://github.com/${repo}/issues/new?title=${issueTitle}&body=${issueBody}`;

        window.open(url, '_blank');
    }
</script>

</body>
</html>
